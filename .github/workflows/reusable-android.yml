name: Reusable Android Deploy

on:
  workflow_call:
    inputs:
      flutter-version:
        description: "Flutter version to use"
        type: string
        default: "3.x"
      package-name:
        description: "Android package name e.g. com.company.app"
        type: string
        required: true
      track:
        description: "Google Play track: internal | beta | production"
        type: string
        default: "internal"
      build-number:
        description: "Build number (leave empty for auto)"
        type: string
        default: ""

    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: true
      ANDROID_STORE_PASSWORD:
        required: true
      ANDROID_KEY_PASSWORD:
        required: true
      ANDROID_KEY_ALIAS:
        required: true
      GOOGLE_PLAY_JSON_KEY:
        required: true

jobs:
  deploy-android:
    name: 🤖 Build & Deploy Android
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout Client Project
        uses: actions/checkout@v4

      - name: ⬇️ Checkout CI/CD Tools
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/flutter-cicd-central
          path: .cicd-central

      - name: 🚚 Copy CI/CD Files
        run: |
          cp .cicd-central/Gemfile .
          cp -r .cicd-central/fastlane .

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ inputs.flutter-version }}
          channel: "stable"
          cache: true

      - name: 💎 Setup Ruby & Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: 🔢 Set Build Number
        run: |
          if [ -z "${{ inputs.build-number }}" ]; then
            echo "BUILD_NUMBER=${{ github.run_number }}" >> $GITHUB_ENV
          else
            echo "BUILD_NUMBER=${{ inputs.build-number }}" >> $GITHUB_ENV
          fi

      - name: 🔑 Decode Keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/keystore.jks

      - name: 📝 Create key.properties
        run: |
          cat > android/key.properties << EOF
          storePassword=${{ secrets.ANDROID_STORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=keystore.jks
          EOF

      - name: 📦 Flutter pub get
        run: flutter pub get

      - name: 🏗️ Build AAB
        run: |
          flutter build appbundle \
            --release \
            --build-number=${{ env.BUILD_NUMBER }}

      - name: 🚀 Upload to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_JSON_KEY }}
          packageName: ${{ inputs.package-name }}
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: ${{ inputs.track }}
          status: completed

      - name: ✅ Done
        run: echo "🎉 Android build ${{ env.BUILD_NUMBER }} uploaded to ${{ inputs.track }}"
